name: PS5 ELF Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip clang-18 lld-18 build-essential python3 python3-pyelftools

    - name: Download Pre-compiled PS5 Payload SDK
      run: |
        # Lädt die offizielle, fertige Version des SDK herunter
        wget https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
        sudo unzip -d /opt ps5-payload-sdk.zip
        
        # Setzt die Umgebungsvariablen für das Makefile
        echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
        echo "PS5SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
        echo "/opt/ps5-payload-sdk/toolchain/bin" >> $GITHUB_PATH

    - name: Compile Payload
      run: |
        make

    - name: Upload Finished ELF
      uses: actions/upload-artifact@v3
      with:
        name: PS5-Homebutton-Payload
        path: homebutton_trigger.elf
