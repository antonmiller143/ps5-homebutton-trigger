name: PS5 ELF Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget cmake ninja-build build-essential python3 python3-pyelftools clang-18 lld-18

    - name: Install PS5 Payload SDK
      run: |
        git clone https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk
        cd ps5-payload-sdk
        make
        echo "PS5SDK=$GITHUB_WORKSPACE/ps5-payload-sdk" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/ps5-payload-sdk/toolchain/bin" >> $GITHUB_PATH

    - name: Compile Payload
      run: |
        export PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-payload-sdk
        make

    - name: Upload Finished ELF
      uses: actions/upload-artifact@v3
      with:
        name: PS5-Homebutton-Payload
        path: homebutton_trigger.elf
