name: PS5 ELF Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install PS5 Payload SDK
      run: |
        git clone https://github.com
        cd ps5-payload-sdk
        make SETUP
        echo "PS5SDK=$GITHUB_WORKSPACE/ps5-payload-sdk" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/ps5-payload-sdk/toolchain/bin" >> $GITHUB_PATH

    - name: Compile Payload
      run: |
        make

    - name: Upload Finished ELF
      uses: actions/upload-artifact@v3
      with:
        name: PS5-Homebutton-Payload
        path: homebutton_trigger.elf
