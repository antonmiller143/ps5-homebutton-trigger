name: PS5 ELF Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Erlaubt die Ausführung auf den aktuellen GitHub-Servern ohne Node-Sperre
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip clang-18 lld-18 build-essential python3 python3-pyelftools

    - name: Download Pre-compiled PS5 Payload SDK
      run: |
        wget https://github.com
        mkdir -p /tmp/sdk-extract
        unzip ps5-payload-sdk.zip -d /tmp/sdk-extract
        sudo mv /tmp/sdk-extract/* /opt/ps5-payload-sdk
        
        echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
        echo "PS5SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
        echo "/opt/ps5-payload-sdk/toolchain/bin" >> $GITHUB_PATH

    - name: Compile Payload
      run: |
        make PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk

    - name: Upload Finished ELF
      uses: actions/upload-artifact@v4
      with:
        name: PS5-Homebutton-Payload
        path: homebutton_trigger.elf
